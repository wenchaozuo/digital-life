[package]
name = "digital-life"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "digital_life_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["backup", "bundled", "functions"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = { version = "=2.5.8", default-features = false, features = ["std"] }
lancedb = { version = "=0.31.0", default-features = false }
arrow-array = "=58.0.0"
arrow-schema = "=58.0.0"
futures = "0.3"
sha2 = "0.10"
zeroize = "1.9"
rustls = { version = "=0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "=1.52.3", default-features = false, features = ["io-util", "net", "sync", "time"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.8"
bytes = "=1.12.1"
http-body-util = "=0.1.3"
hyper = { version = "=1.10.1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
raw-window-handle = "=0.6.2"
windows-future = "=0.2.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "=1.52.3", default-features = false, features = ["macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_RestartManager", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "=0.61.3", features = [
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
