[[permission]]
identifier = "chat-commands"
description = "Safe conversation, life, persona, and governed memory commands for the chat window."
commands.allow = [
    "chat_with_governed_context",
    "create_conversation",
    "list_conversations",
    "get_conversation_messages",
    "rename_conversation",
    "delete_conversation",
    "open_settings_window",
    "get_current_life_identity",
    "get_persona_template",
    "create_memory_candidate",
    "update_memory_candidate",
    "delete_memory",
    "prepare_candidate_confirmation",
    "confirm_candidate_memory",
    "cancel_candidate_confirmation_approval",
]
