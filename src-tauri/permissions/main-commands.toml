[[permission]]
identifier = "main-commands"
description = "Commands required by the main digital-life window."
commands.allow = [
    "open_settings_window",
    "open_chat_window",
    "start_vita_sidecar",
    "get_vita_sidecar_status",
    "confirm_vita_sidecar",
    "deny_vita_sidecar",
    "cancel_vita_sidecar",
    "stop_vita_sidecar",
    "initialize_storage",
    "save_life_identity",
    "get_current_life_identity",
    "get_life_identity",
    "update_life_identity_base_info",
    "save_persona_template",
    "get_persona_template",
    "get_body_package_registry_snapshot",
    "get_cubism_core_snapshot",
    "observe_screen_now",
    "prepare_main_screen_context_for_chat",
    "get_main_screen_perception_status",
    "offer_main_screen_context_to_chat",
    "revoke_main_pending_screen_context_grant",
    "revoke_main_screen_context_attachment",
    "prepare_main_screen_vision_review",
    "get_main_screen_vision_status",
    "execute_main_screen_vision_review",
    "abandon_main_screen_vision_delivery",
    "offer_screen_vision_result_to_chat",
]
