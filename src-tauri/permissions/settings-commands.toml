[[permission]]
identifier = "settings-commands"
description = "Storage, model-profile, credential, and manual vector-index management commands for Settings."
commands.allow = [
    "close_settings_window",
    "get_current_life_identity",
    "get_storage_location",
    "validate_storage_location",
    "migrate_storage_location",
    "create_model_profile",
    "list_model_profiles",
    "get_model_profile",
    "update_model_profile",
    "delete_model_profile",
    "set_active_model_profile",
    "get_active_model_profile",
    "test_model_profile_connection",
    "save_api_credential",
    "has_api_credential",
    "delete_api_credential",
    "get_memory_vector_index_status",
    "start_memory_vector_index_rebuild",
    "get_memory_vector_index_job",
    "cancel_memory_vector_index_job",
]
